name: unit

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "server.js"
      - "client.js"
      - "lib/**"
      - "scripts/**"
      - "tests/**"
      - "integrations/**"
      - "package.json"
      - ".github/workflows/unit.yml"

permissions:
  contents: read

concurrency:
  group: unit-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # PRs always. Main only for direct commits — skip PR merges and the star-chart bot.
    if: >
      github.event_name == 'pull_request' || (
        !contains(github.event.head_commit.message, 'Merge pull request') &&
        !contains(github.event.head_commit.message, 'Refresh the committed GitHub star chart')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax
        if: github.event_name == 'pull_request'
        run: npm run test:syntax
      - name: Unit tests
        run: npm run test:unit
